// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.0.2"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    minSdkVersion       = 26
    targetSdkVersion    = 29
    compileSdkVersion   = 29
    buildToolsVersion   = '28.0.3'
    versionName         = "3.0"
    versionCode         = 3

    core_ktx        = '1.3.1'
    appcompat       = '1.1.0'
    recyclerview    = '1.1.0'
    cardview        = '1.0.0'
    material        = '1.1.0'
    retrofit        = '2.9.0'
    glide           = '4.8.0'
    lifecycle       = '2.2.0'
    room            = '2.2.5'
    paging          = '2.1.2'
    datetime        = '1.1.1'
    chart           = '3.1.0'
    font            = '2.3.0'
    preference      = '1.1.1'
    time_picker     = '1.0.0'
    material        = '1.3.0-alpha02'
    jsoup           = '1.10.2'
    custom_search   = 'v1-rev20200707-1.30.10'
    work_manager    = '2.4.0'
    activity        = '1.1.0'
    fragment        = '1.2.5'
    coroutine       = '1.3.9'
}